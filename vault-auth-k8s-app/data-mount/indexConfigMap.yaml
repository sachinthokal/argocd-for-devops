apiVersion: v1
data:
  index.html: "<!DOCTYPE html>\r\n<html lang=\"en\">\r\n<head>\r\n  <meta charset=\"UTF-8\"
    />\r\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"
    />\r\n  <title>Kubernetes Volumes & VolumeMounts</title>\r\n  <style>\r\n    :root
    {\r\n      --bg: #08101f;\r\n      --panel: rgba(22, 32, 56, 0.95);\r\n      --accent:
    #6c8ef4;\r\n      --accent-soft: #3d63c9;\r\n      --text: #f4f7ff;\r\n      --muted:
    #9ab2d5;\r\n      --border: rgba(255, 255, 255, 0.08);\r\n    }\r\n\r\n    * {\r\n
    \     box-sizing: border-box;\r\n      margin: 0;\r\n      padding: 0;\r\n    }\r\n\r\n
    \   body {\r\n      min-height: 100vh;\r\n      font-family: Inter, system-ui,
    sans-serif;\r\n      color: var(--text);\r\n      background: radial-gradient(circle
    at top left, #2f4fc1 0%, transparent 30%),\r\n        radial-gradient(circle at
    bottom right, #4d2fc0 0%, transparent 25%),\r\n        linear-gradient(180deg,
    #09101d 0%, #05080f 100%);\r\n      line-height: 1.6;\r\n    }\r\n\r\n    .page
    {\r\n      max-width: 1160px;\r\n      margin: 0 auto;\r\n      padding: 40px
    24px 64px;\r\n    }\r\n\r\n    header {\r\n      display: flex;\r\n      align-items:
    center;\r\n      justify-content: space-between;\r\n      gap: 24px;\r\n      padding-bottom:
    32px;\r\n      border-bottom: 1px solid rgba(255, 255, 255, 0.08);\r\n    }\r\n\r\n
    \   .brand {\r\n      display: grid;\r\n      gap: 8px;\r\n    }\r\n\r\n    .brand
    strong {\r\n      font-size: 1.5rem;\r\n      letter-spacing: 0.02em;\r\n    }\r\n\r\n
    \   .brand span {\r\n      color: var(--muted);\r\n      font-size: 0.96rem;\r\n
    \   }\r\n\r\n    .tag {\r\n      display: inline-flex;\r\n      align-items: center;\r\n
    \     gap: 8px;\r\n      padding: 10px 18px;\r\n      border-radius: 999px;\r\n
    \     background: rgba(109, 136, 247, 0.12);\r\n      border: 1px solid rgba(109,
    136, 247, 0.18);\r\n      color: var(--text);\r\n      font-size: 0.95rem;\r\n
    \     font-weight: 600;\r\n    }\r\n\r\n    .hero {\r\n      display: grid;\r\n
    \     gap: 28px;\r\n      padding: 44px 0 32px;\r\n    }\r\n\r\n    .hero-title
    {\r\n      font-size: clamp(2.5rem, 5vw, 4rem);\r\n      line-height: 1.05;\r\n
    \     max-width: 820px;\r\n    }\r\n\r\n    .hero-subtitle {\r\n      max-width:
    760px;\r\n      font-size: 1.08rem;\r\n      color: var(--muted);\r\n    }\r\n\r\n
    \   .hero-actions {\r\n      display: flex;\r\n      gap: 16px;\r\n      flex-wrap:
    wrap;\r\n      align-items: center;\r\n    }\r\n\r\n    .button,\r\n    .button-secondary
    {\r\n      display: inline-flex;\r\n      align-items: center;\r\n      justify-content:
    center;\r\n      gap: 10px;\r\n      padding: 14px 24px;\r\n      border-radius:
    999px;\r\n      text-decoration: none;\r\n      font-weight: 700;\r\n      transition:
    transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;\r\n    }\r\n\r\n
    \   .button {\r\n      background: linear-gradient(135deg, #6c8ef4 0%, #4a6de9
    100%);\r\n      color: #fff;\r\n      box-shadow: 0 18px 40px rgba(49, 72, 156,
    0.18);\r\n      border: none;\r\n    }\r\n\r\n    .button:hover {\r\n      transform:
    translateY(-2px);\r\n    }\r\n\r\n    .button-secondary {\r\n      color: var(--text);\r\n
    \     border: 1px solid rgba(255, 255, 255, 0.16);\r\n      background: rgba(255,
    255, 255, 0.04);\r\n    }\r\n\r\n    .section {\r\n      display: grid;\r\n      gap:
    20px;\r\n      margin-top: 24px;\r\n    }\r\n\r\n    .panel {\r\n      background:
    var(--panel);\r\n      border: 1px solid var(--border);\r\n      border-radius:
    28px;\r\n      padding: 28px;\r\n      backdrop-filter: blur(18px);\r\n    }\r\n\r\n
    \   .grid {\r\n      display: grid;\r\n      gap: 20px;\r\n    }\r\n\r\n    .grid-2
    {\r\n      grid-template-columns: repeat(2, minmax(0, 1fr));\r\n    }\r\n\r\n
    \   .feature-card {\r\n      padding: 26px;\r\n      border-radius: 24px;\r\n
    \     border: 1px solid rgba(255, 255, 255, 0.08);\r\n      background: rgba(255,
    255, 255, 0.03);\r\n      min-height: 220px;\r\n      display: flex;\r\n      flex-direction:
    column;\r\n      justify-content: space-between;\r\n    }\r\n\r\n    .feature-card
    h3 {\r\n      margin-bottom: 12px;\r\n      font-size: 1.25rem;\r\n    }\r\n\r\n
    \   .feature-card p {\r\n      color: var(--muted);\r\n      line-height: 1.7;\r\n
    \   }\r\n\r\n    .code-block {\r\n      margin-top: 20px;\r\n      padding: 20px;\r\n
    \     border-radius: 18px;\r\n      background: rgba(10, 18, 33, 0.96);\r\n      border:
    1px solid rgba(255, 255, 255, 0.08);\r\n      font-family: ui-monospace, SFMono-Regular,
    Menlo, Monaco, Consolas, monospace;\r\n      font-size: 0.95rem;\r\n      color:
    #cbd6f2;\r\n      overflow-x: auto;\r\n      line-height: 1.6;\r\n    }\r\n\r\n
    \   .code-block code {\r\n      display: block;\r\n      white-space: pre;\r\n
    \   }\r\n\r\n    .comparison {\r\n      display: grid;\r\n      gap: 20px;\r\n
    \     grid-template-columns: 1fr 1fr;\r\n    }\r\n\r\n    .comparison .card {\r\n
    \     padding: 24px;\r\n      border-radius: 22px;\r\n      background: rgba(255,
    255, 255, 0.03);\r\n      border: 1px solid rgba(255, 255, 255, 0.08);\r\n    }\r\n\r\n
    \   .comparison h3 {\r\n      margin-bottom: 14px;\r\n      font-size: 1.18rem;\r\n
    \   }\r\n\r\n    .comparison p {\r\n      color: var(--muted);\r\n      line-height:
    1.7;\r\n    }\r\n\r\n    footer {\r\n      margin-top: 42px;\r\n      padding-top:
    32px;\r\n      border-top: 1px solid rgba(255, 255, 255, 0.08);\r\n      color:
    var(--muted);\r\n      font-size: 0.95rem;\r\n      display: flex;\r\n      justify-content:
    space-between;\r\n      align-items: center;\r\n      flex-wrap: wrap;\r\n      gap:
    16px;\r\n    }\r\n\r\n    @media (max-width: 900px) {\r\n      .grid-2,\r\n      .comparison
    {\r\n        grid-template-columns: 1fr;\r\n      }\r\n\r\n      header {\r\n
    \       flex-direction: column;\r\n        align-items: flex-start;\r\n      }\r\n\r\n
    \     .hero-actions {\r\n        width: 100%;\r\n      }\r\n    }\r\n  </style>\r\n</head>\r\n<body>\r\n
    \ <div class=\"page\">\r\n    <header>\r\n      <div class=\"brand\">\r\n        <strong>VolumeCraft</strong>\r\n
    \       <span>Premium Kubernetes learning gateway</span>\r\n      </div>\r\n      <div
    class=\"tag\">Volumes & VolumeMounts</div>\r\n    </header>\r\n\r\n    <section
    class=\"hero\">\r\n      <div>\r\n        <h1 class=\"hero-title\">Master Kubernetes
    Volumes and VolumeMounts with a clean, modern guide.</h1>\r\n        <p class=\"hero-subtitle\">Understand
    how persistent data is stored, shared, and mounted inside Pods. Learn the core
    concepts, best practices, and YAML examples for Kubernetes storage.</p>\r\n      </div>\r\n
    \     <div class=\"hero-actions\">\r\n        <a class=\"button\" href=\"#overview\">Get
    Started</a>\r\n        <a class=\"button-secondary\" href=\"#comparison\">Why
    it matters</a>\r\n      </div>\r\n    </section>\r\n\r\n    <section id=\"overview\"
    class=\"section\">\r\n      <div class=\"panel\">\r\n        <h2>What you will
    learn</h2>\r\n        <div class=\"grid grid-2\">\r\n          <div class=\"feature-card\">\r\n
    \           <div>\r\n              <h3>Volumes</h3>\r\n              <p>Discover
    how Kubernetes Volumes provide lifecycle-bound storage that lives as long as the
    Pod, and see how different volume types support config, secrets, host storage,
    and cloud disks.</p>\r\n            </div>\r\n          </div>\r\n          <div
    class=\"feature-card\">\r\n            <div>\r\n              <h3>VolumeMounts</h3>\r\n
    \             <p>Learn how containers within a Pod access Volumes through VolumeMounts
    and how to attach storage paths inside your application containers safely and
    consistently.</p>\r\n            </div>\r\n          </div>\r\n        </div>\r\n
    \     </div>\r\n    </section>\r\n\r\n    <section class=\"section\">\r\n      <div
    class=\"panel\">\r\n        <h2>Quick YAML preview</h2>\r\n        <div class=\"code-block\">\r\n
    \         <code>apiVersion: v1\r\nkind: Pod\r\nmetadata:\r\n  name: example-pod\r\nspec:\r\n
    \ containers:\r\n    - name: app\r\n      image: nginx:latest\r\n      volumeMounts:\r\n
    \       - name: site-data\r\n          mountPath: /usr/share/nginx/html\r\n  volumes:\r\n
    \   - name: site-data\r\n      emptyDir: {}</code>\r\n        </div>\r\n      </div>\r\n
    \   </section>\r\n\r\n    <section id=\"comparison\" class=\"section\">\r\n      <div
    class=\"comparison\">\r\n        <div class=\"card\">\r\n          <h3>Volume</h3>\r\n
    \         <p>A Volume defines how and where storage is provisioned. It can be
    backed by ephemeral storage, host paths, secrets, configmaps, NFS, cloud volumes,
    or persistent storage solutions.</p>\r\n        </div>\r\n        <div class=\"card\">\r\n
    \         <h3>VolumeMount</h3>\r\n          <p>A VolumeMount attaches the Volume
    into a container filesystem. It selects a path and controls whether the mount
    is read-only or writable, making data available to the running application.</p>\r\n
    \       </div>\r\n      </div>\r\n    </section>\r\n\r\n    <footer>\r\n      <span>Designed
    for Kubernetes learners who want a premium and simple experience.</span>\r\n      <span>Build
    better Pods with confident storage design.</span>\r\n    </footer>\r\n  </div>\r\n</body>\r\n</html>"
kind: ConfigMap
metadata:
  name: app-config
