kind: Deployment
apiVersion: apps/v1
metadata:
  name: cicd-compass-deployment
  namespace: compass
  labels:
    app: cicd-compass
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-compass
  template:
    metadata:
      name: cicd-compass-pod
      labels:
        app: cicd-compass
    spec:
      containers:
        - name: cicd-compass-container
          image: sachinthokal/cicd-compass-app@sha256:5fe9b1d50bfb75734526958d511622b508c9a04437c0dfc0494fb68a0ee594e7
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cicd-compass-configmap
