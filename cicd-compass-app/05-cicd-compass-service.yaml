kind: Service
apiVersion: v1
metadata:
  name: cicd-compass-service
  namespace: compass
spec:
  selector:
    app: cicd-compass
    version: green
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: cicd-compass-stable-service
  namespace: compass
spec:
  selector:
    app: cicd-compass
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-compass-canary-service
  namespace: compass
spec:
  selector:
    app: cicd-compass
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080