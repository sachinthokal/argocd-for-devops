apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: canary-app-ingress
  namespace: canary
spec:
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-stable-service
                port:
                  number: 80