apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: master-unified-ingress
  namespace: blue-green
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: localhost
    http:
      paths:
      # 1. Blue-Green Active Path
      - path: /blue-green
        pathType: Prefix
        backend:
          service:
            name: blue-green-active-service
            port:
              number: 80
      # 2. Blue-Green Preview Path
      - path: /blue-green/preview
        pathType: Prefix
        backend:
          service:
            name: blue-green-preview-service
            port:
              number: 80