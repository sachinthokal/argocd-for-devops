apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-green-app
  namespace: blue-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: blue-green-app
  strategy:
    blueGreen:
      activeService: blue-green-active-service
      previewService: blue-green-preview-service
      trafficRouting:
        nginx:
          stableIngress: master-unified-ingress
  template:
    metadata:
      labels:
        app: blue-green-app
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:0.2.3
        imagePullPolicy: IfNotPresent
        args:
        - "-text=Blue-Green Version v1"
        ports:
        - containerPort: 5678