kind: Namespace
apiVersion: v1
metadata:
  name: k8s-app
  labels:
    name: k8s-app

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: k8s-deployment
  namespace: k8s-app
  labels:
    app: k8s-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-app
  template:
    metadata:
      labels:
        app: k8s-app
    spec:
      containers:
        - name: k8s-container
          image: sachinthokal/k8s_vault_sync_app:v1
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets"
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "azure-kv-provider"
            nodePublishSecretRef:
              name: secrets-store-creds

---

kind: Service
apiVersion: v1
metadata:
  name: k8s-service
  namespace: k8s-app
  labels:
    app: k8s-app
spec:
  type: NodePort
  selector:
    app: k8s-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081