apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-provider
  namespace: k8s-app
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    keyvaultName: "k8s-app-akv"            # Your Azure Key Vault Name
    tenantId: "341XXXX4-XXXX-XXXX-XXXX-7eXXXXc68958"       # Your Azure Tenant ID
    objects:  |
      array:
        - |
          objectName: "db-password"         # Key Vault secret name 
          objectType: "secret"
          objectAlias: "db-password"        # Name of the file to be mounted in the pod
  secretObjects: []                         # Optional: Specify the desired Kubernetes secret objects to be created