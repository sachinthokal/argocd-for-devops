# yaml-language-server: $schema=none
controller:
  hostPort:
    enabled: true
  admissionWebhooks:
    enabled: false
  terminationGracePeriodSeconds: 0
  publishService:
    enabled: false
  service:
    type: NodePort
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Equal"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Equal"
      effect: "NoSchedule"
  extraArgs:
    publish-status-address: "localhost"
