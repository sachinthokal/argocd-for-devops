apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calico-cni
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sachinthokal/ArgoCD_For_Devops.git'
    targetRevision: main
    path: cluster-addons/calico
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true