###############################################################################
# Telecom Frontend UI Deployment & ClusterIP Service
# -----------------------------------------------------------------------------
# PURPOSE:
# Deploys the static/SPA web user interface (React/Angular/Vue/HTML)
# served via NGINX/Web server on container port 80.
# Exposes the frontend internally for the Ingress Controller to route traffic.
###############################################################################

# -----------------------------------------------------------------------------
# 1. Frontend Application Deployment
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stelcom-frontend-deployment
  namespace: stel-ns
  labels:
    app.kubernetes.io/name: stelcom-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stelcom-frontend-app    
  template:
    metadata:
      labels:
        app: stelcom-frontend-app
        app.kubernetes.io/name: stelcom-frontend
    spec:
      containers:
        - name: stelcom-frontend-container
          image: sachinthokal/stelcom-frontend:v8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-web
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

          # -------------------------------------------------------------------
          # Health Probes
          # -------------------------------------------------------------------
          # 1. Startup Probe: Ensures NGINX has initialized before other probes run
          startupProbe:
            httpGet:
              path: /
              port: http-web
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          # 2. Liveness Probe: Restarts the container if the web server hangs or crashes
          livenessProbe:
            httpGet:
              path: /
              port: http-web
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # 3. Readiness Probe: Checks if NGINX is ready to receive Ingress traffic
          readinessProbe:
            httpGet:
              path: /
              port: http-web
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

---

# -----------------------------------------------------------------------------
# 2. Frontend ClusterIP Service
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: stelcom-frontend-service
  namespace: stel-ns
  labels:
    app.kubernetes.io/name: stelcom-frontend
    app.kubernetes.io/component: frontend-service
spec:
  # ClusterIP exposes the web service internally for the Ingress Controller
  type: ClusterIP
  selector:
    app: stelcom-frontend-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80