kind: Deployment
apiVersion: apps/v1
metadata:
  name: stelcom-frontend-deployment
  namespace: stel-ns
spec:
  selector:
    matchLabels:
      app: stelcom-frontend-app    
  template:
    metadata:
      labels:
        app: stelcom-frontend-app
    spec:
      containers:
        - name: stelcom-frontend-container
          image: sachinthokal/stelcom-frontend:v3
          ports:
            - containerPort: 80
          
---
kind: Service
apiVersion: v1
metadata:
  name: stelcom-frontend-service
  namespace: stel-ns
spec:
  selector:
    app: stelcom-frontend-app
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
    