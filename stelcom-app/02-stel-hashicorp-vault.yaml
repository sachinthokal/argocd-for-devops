apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-db-creds
  namespace: stel-ns
  labels:
    app.kubernetes.io/name: telecom-app
    app.kubernetes.io/component: secrets-provider
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.vault.svc.cluster.local:8200"
    roleName: "myapp-role"
    objects: |
      - objectName: "POSTGRES_DB"
        secretPath: "secret/data/myapp/config"
        secretKey: "DB_Name"
      - objectName: "DB_USER"
        secretPath: "secret/data/myapp/config"
        secretKey: "DB_USER"
      - objectName: "DB_PASSWORD"
        secretPath: "secret/data/myapp/config"
        secretKey: "DB_PASSWORD"
      - objectName: "DB_URL"
        secretPath: "secret/data/myapp/config"
        secretKey: "DB_URL"
      - objectName: "DB_DRIVER"
        secretPath: "secret/data/myapp/config"
        secretKey: "DB_DRIVER"
      - objectName: "GATEWAY_API_KEY"
        secretPath: "secret/data/myapp/config"
        secretKey: "GATEWAY_API_KEY"

  # ---------------------------------------------------------------------------
  # Kubernetes Secret Auto-Sync
  # ---------------------------------------------------------------------------
  secretObjects:
    # 1. Application Secret (Opaque)
    - secretName: app-env-secrets
      type: Opaque
      data:
        - objectName: "POSTGRES_DB"
          key: "POSTGRES_DB"
        - objectName: "DB_USER"
          key: "DB_USER"
        - objectName: "DB_PASSWORD"
          key: "DB_PASSWORD"
        - objectName: "DB_URL"
          key: "DB_URL"
        - objectName: "DB_DRIVER"
          key: "DB_DRIVER"
        - objectName: "GATEWAY_API_KEY"
          key: "GATEWAY_API_KEY"

    # 2. Kong Gateway - Key-Auth Secret (konghq.com/credential)
    - secretName: kong-keyauth-secret
      type: "konghq.com/credential"
      labels:
        konghq.com/credential: "key-auth"
      data:
        - objectName: "GATEWAY_API_KEY"
          key: "key"