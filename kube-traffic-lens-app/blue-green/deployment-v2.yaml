apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-traffic-lens-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-traffic-lens
      version: v2
  template:
    metadata:
      name: kube-traffic-lens
      labels:
        app: kube-traffic-lens
        version: v2
    spec:
      containers:
      - name: app
        image: sachinthokal/kube-traffic-lens-app:v2.0.0
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "v2.0.0"