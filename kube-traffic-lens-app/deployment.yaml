apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-traffic-lens
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-traffic-lens
  template:
    metadata:
      name: kube-traffic-lens
      labels:
        app: kube-traffic-lens
    spec:
      containers:
        - name: app
          image: sachinthokal/kube-traffic-lens-app@sha256:1321eea52828b3d01960f243dab8b81df8c358080c208c48a136c5a588dbdffc
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v1.0.0"
env: []
